<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d1611">
  <meta name="description" content="TRUE HOOF: a calm, craftsmanlike cattle hoof-trimming game.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="True Hoof">
  <title>True Hoof</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">TRUE <span>HOOF</span></div>
      <div id="caseTitle"></div>
      <div class="top-actions">
        <button id="btnGuides" class="chip on" aria-pressed="true" title="Guided lines (G)">Guides</button>
        <button id="btnSound" class="chip on" aria-pressed="true" title="Sound (M)">Sound</button>
        <button id="btnLefty" class="chip" aria-pressed="false" title="Left-handed touch grip: tool tip sits up-right of your finger">Lefty</button>
        <button id="btnSteps" class="chip narrow-only" title="Show steps">Steps</button>
      </div>
    </header>

    <div id="stepBar" class="narrow-only">
      <div>
        <div id="stepBarLabel"></div>
        <div id="stepBarTip"></div>
      </div>
      <button id="btnReadBar" class="primary small" hidden>Commit read</button>
      <button id="btnReleaseBar" class="primary small">Release</button>
    </div>

    <main id="stage">
      <aside id="stepsPanel">
        <div class="panel-inner">
          <h2>The trim</h2>
          <div id="coach" hidden aria-live="polite">
            <div id="coachCount"></div>
            <div id="coachTitle"></div>
            <div id="coachText"></div>
            <div class="coach-track"><div id="coachBar"></div></div>
          </div>
          <ol id="stepsList"></ol>
          <p id="stepTip"></p>
          <button id="btnRead" class="primary" hidden>Commit your read</button>
          <button id="btnRelease" class="primary">Release the cow</button>
          <p class="fine">Balance and correctness score. Speed doesn’t. Drawing blood ends the case.</p>
        </div>
      </aside>
      <div id="canvasWrap">
        <canvas id="game" aria-label="Hoof trimming play area"></canvas>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>

    <footer id="dock">
      <div id="toolInfo"></div>
      <div id="tools" role="toolbar" aria-label="Tools"></div>
    </footer>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card" id="modalCard"></div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    // Offline + installable PWA. Skipped inside the Capacitor app, which already ships the files.
    if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform?.()) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
